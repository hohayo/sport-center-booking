<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>運動中心預約連結產生器</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --border:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f26; --text:#e8eaed; --muted:#9aa3af; --accent:#60a5fa; --border:#374151; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; display:grid; gap:14px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  label { display:grid; gap:6px; font-size:.9rem; color:var(--muted); }
  select, input[type=date] { font:inherit; font-size:1rem; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); width:100%; }
  .result { margin-top:16px; background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .result a { color:var(--accent); word-break:break-all; }
  .result a.btn { color:#fff; }
  .actions { display:flex; gap:8px; margin-top:12px; }
  button, .btn { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; text-align:center; flex:1; }
  .field { display:grid; gap:6px; }
  .field-label { font-size:.9rem; color:var(--muted); }
  .seg { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .seg-item { position:relative; display:grid; gap:2px; justify-items:center; padding:10px 4px; border:1px solid var(--border); border-radius:8px; cursor:pointer; color:var(--text); text-align:center; }
  .seg-item[hidden] { display:none; }
  .seg-item input { position:absolute; opacity:0; pointer-events:none; }
  .seg-name { font-size:1rem; font-weight:600; }
  .seg-item small { font-size:.72rem; color:var(--muted); }
  .seg-item:has(input:checked) { background:var(--accent); border-color:var(--accent); color:#fff; }
  .seg-item:has(input:checked) small { color:rgba(255,255,255,.85); }
  .seg-item:has(input:focus-visible) { outline:2px solid var(--accent); outline-offset:2px; }
  footer { margin-top:24px; text-align:center; font-size:.8rem; color:var(--muted); }
  #toast { position:fixed; left:50%; bottom:32px; transform:translate(-50%,20px); background:#16a34a; color:#fff; padding:12px 20px; border-radius:999px; box-shadow:0 4px 12px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .row { display:flex; gap:8px; }
  .row select { flex:1; min-width:0; }
  .row button { flex:none; white-space:nowrap; }
  button.secondary { background:transparent; color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>運動中心預約連結產生器</h1>
  <div class="card">
    <div class="field">
      <span class="field-label">運動中心</span>
      <div class="row">
        <select id="center">
          <option value="https://bymca.xuanen.com.tw/ymca01.aspx?module=net_booking&files=booking_place&StepFlag=2" data-places="1,6,13" data-check="https://bymca.xuanen.com.tw/ymca01.aspx?Module=ind&files=ind">新生運動中心</option>
          <option value="https://scr.cyc.org.tw/tp25.aspx?module=net_booking&files=booking_place&StepFlag=2" data-places="1,3,8" data-check="https://scr.cyc.org.tw/tp25.aspx?Module=ind&files=ind">南港運動中心</option>
          <option value="https://www.cjcf.com.tw/CG02.aspx?module=net_booking&files=booking_place&StepFlag=2" data-places="1,3,4,8" data-check="https://www.cjcf.com.tw/CG02.aspx?Module=ind&files=ind">大安運動中心</option>
          <option value="https://bwd.xuanen.com.tw/wd27.aspx?module=net_booking&files=booking_place&StepFlag=2" data-places="1,3" data-check="https://bwd.xuanen.com.tw/wd27.aspx?Module=ind&files=ind">中正運動中心</option>
          <option value="https://fe.xuanen.com.tw/fe01.aspx?module=net_booking&files=booking_place&StepFlag=2" data-places="1,3,8,13" data-check="https://fe.xuanen.com.tw/fe01.aspx?Module=ind&files=ind">三重運動中心</option>
          <option value="https://fe.xuanen.com.tw/fe03.aspx?module=net_booking&files=booking_place&StepFlag=2" data-places="1,2,3,8,13" data-check="https://fe.xuanen.com.tw/fe03.aspx?Module=ind&files=ind">土城運動中心</option>
        </select>
        <button type="button" class="secondary" id="checkBtn">檢查登入</button>
      </div>
    </div>
    <label>日期
      <input type="date" id="date">
    </label>
    <div class="field">
      <span class="field-label">場地</span>
      <div class="seg" id="place" role="radiogroup" aria-label="場地">
        <label class="seg-item"><input type="radio" name="place" value="1" checked><span class="seg-name">羽球</span></label>
        <label class="seg-item"><input type="radio" name="place" value="2"><span class="seg-name">籃球</span></label>
        <label class="seg-item"><input type="radio" name="place" value="3"><span class="seg-name">桌球</span></label>
        <label class="seg-item"><input type="radio" name="place" value="4"><span class="seg-name">撞球</span></label>
        <label class="seg-item"><input type="radio" name="place" value="6"><span class="seg-name">網球</span></label>
        <label class="seg-item"><input type="radio" name="place" value="8"><span class="seg-name">壁球</span></label>
        <label class="seg-item"><input type="radio" name="place" value="13"><span class="seg-name">匹克球</span></label>
      </div>
    </div>
    <div class="field">
      <span class="field-label">時段</span>
      <div class="seg" id="slot" role="radiogroup" aria-label="時段">
        <label class="seg-item"><input type="radio" name="slot" value="1"><span class="seg-name">早上</span><small>06:00 ～ 12:00</small></label>
        <label class="seg-item"><input type="radio" name="slot" value="2"><span class="seg-name">下午</span><small>12:00 ～ 18:00</small></label>
        <label class="seg-item"><input type="radio" name="slot" value="3" checked><span class="seg-name">晚上</span><small>18:00 ～ 22:00</small></label>
      </div>
    </div>
  </div>

  <div class="result">
    <a id="link" href="#" target="_blank" rel="noopener"></a>
    <div class="actions">
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">前往</a>
      <button class="secondary" id="copy" type="button">複製連結</button>
    </div>
  </div>
<footer>作者：Kyle, Chuang</footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const t = new Date();
  $("date").value = `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;

  function update() {
    const d = $("date").value.replaceAll("-", "/"); // YYYY/MM/DD
    const url = `${$("center").value}&D=${d}&PT=${document.querySelector('input[name="place"]:checked').value}&D2=${document.querySelector('input[name="slot"]:checked').value}`;
    $("link").textContent = url;
    $("link").href = url;
    $("open").href = url;
  }
  ["center","date","place","slot"].forEach(id => $(id).addEventListener("input", update));
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("link").href); showToast("✓ 複製成功"); }
    catch { showToast("複製失敗，請手動複製"); }
  });
  let toastTimer;
  function showToast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }
  // 依所選運動中心，只顯示該中心有的場地
  function applyPlaces() {
    const allowed = $("center").selectedOptions[0].dataset.places.split(",");
    const radios = [...document.querySelectorAll('input[name="place"]')];
    radios.forEach(r => { r.closest(".seg-item").hidden = !allowed.includes(r.value); });
    const checked = radios.find(r => r.checked);
    if (!checked || checked.closest(".seg-item").hidden) {
      radios.find(r => !r.closest(".seg-item").hidden).checked = true;
    }
    update();
  }
  $("center").addEventListener("change", applyPlaces);

  $("checkBtn").addEventListener("click", () => {
    window.open($("center").selectedOptions[0].dataset.check, "_blank", "noopener");
  });

  applyPlaces();
</script>
</body>
</html>
